<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwindcss CDN -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-bgBody: #2c2446;
        --color-bgMain: #292240;
        --color-bgCard: #231f39;
        --color-bgFooter: #1e1a36;
        --color-bgBtn: #02c0cb;
        --color-bgProTag: #f9bd0a;
      }
    </style>
    <title>Pro Profile | iCode This 16.11.2026</title>
</head>
<body class="bg-[var(--color-bgMain)] lg:bg-[var(--color-bgBody)] w-full h-[100dvh]">

    <!-- Container -->
     <section class="flex justify-center items-center w-[65%] h-[100dvh] bg-[var(--color-bgMain)] mx-auto">
        <!-- Card -->
         <div class="flex flex-col justify-start items-left w-83 h-119 bg-[var(--color-bgCard)] rounded shadow-lg/20 relative">
            <h3 class="text-[.7rem] text-[var(--color-bgCard)] text-center font-bold font-sans bg-[var(--color-bgProTag)] w-9 h-5 rounded ml-5 mt-5 ">PRO</h3>

            <!-- Avatar -->
            <div class="flex justify-center items-center w-27 h-27 rounded-full border-1 border-[var(--color-bgBtn)] absolute top-10 left-1/2 transform -translate-x-1/2">
                <img src="https://github.com/SaadYasin/web-images/blob/main/avatar5.jpg?raw=true" alt="Avatar" class="w-24 h-24 rounded-full ">
                
            </div>
            <!-- Card text -->
            <div class="text-white/40 font-semibold text-center mt-30">
               <h1 class="text-[.95rem] mt-1 ">Martina Williams</h1> 
               <h3 class="text-[.65rem] mt-1 ">NEW YORK</h3>
               <p class="text-[.75rem] w-[60%] mx-auto mt-1 mb-5">User interface designer and front end developer.</p>

               <!-- Buttons -->
                <div class="flex justify-between items-center px-4 md:px-15 lg:px-12 mb-7">
                    <button class="text-[.8rem] text-white/70 font-normal w-25 md:w-27.7 lg:w-28 h-11 bg-[var(--color-bgBtn)] rounded hover:bg-transparent hover:border-1 hover:border-[var(--color-bgBtn)]/50 hover:text-[var(--color-bgBtn)]/50 px-6">Message</button>
                    <button class="text-[.8rem] text-[var(--color-bgBtn)]/60 font-normal w-25 md:w-27.7 lg:w-28 h-11 border-1 border-[var(--color-bgBtn)]/50 rounded hover:bg-[var(--color-bgBtn)]/50 hover:text-white px-6">Following</button>
                </div>

                <!-- Footer -->
                 <div class="flex flex-col justify-left w-full h-35 rounded-b bg-[var(--color-bgFooter)]">
                    <h3 class="text-[.7rem] text-gray-500 text-left ml-4 mt-3 mb-1">SKILLS</h3>
                    <div class="flex items-center flex-wrap gap-2 ml-4">
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">UI/UX</h3>
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">Front End Development</h3>
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">HTML</h3>
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">Front End Development</h3>
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">Jquery</h3>
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">CSS</h3>
                        <h3 class="text-[.7rem] text-white/40 font-normal px-3 py-1 border-1 border-gray-700/40">Adobe</h3>
                        
                    </div>
                 </div>
            </div>
            
         </div>
     </section>
    
</body>
</html>
